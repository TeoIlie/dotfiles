# Prefix: Ctrl+A (press twice to send a literal Ctrl+A to the shell/Vim)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse: click to select panes/windows, drag to resize, scroll history
set -g mouse on

# Copy mouse/keyboard selections to the system clipboard, using whichever
# tool fits this machine (later matches win: macOS > Wayland > X11).
# With none of them (e.g. over SSH), tmux falls back to OSC 52 and the
# outer terminal sets the clipboard if it supports that.
if-shell 'command -v xclip >/dev/null && [ -n "$DISPLAY" ]' "set -s copy-command 'xclip -selection clipboard -i'"
if-shell 'command -v wl-copy >/dev/null && [ -n "$WAYLAND_DISPLAY" ]' "set -s copy-command 'wl-copy'"
if-shell 'command -v pbcopy >/dev/null' "set -s copy-command 'pbcopy'"

# General
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB,xterm-kitty:RGB,xterm-ghostty:RGB"
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# ── Tokyo Night theme (matches ~/.config/starship.toml) ───────────
# Palette: change colours here only
set -g @tn_text   "#e3e5e5"
set -g @tn_subtle "#a0a9cb"
set -g @tn_muted  "#545c7e"
set -g @tn_dark   "#090c0c"
set -g @tn_bg     "#1a1b26"
set -g @tn_lilac  "#a3aed2"
set -g @tn_blue   "#769ff0"
set -g @tn_slate  "#394260"
set -g @tn_navy   "#212736"
set -g @tn_ink    "#1d2230"
set -g @tn_orange "#ff9e64"

# Accents turn orange while the prefix (Ctrl+A) is held
set -g @tn_accent "#{?client_prefix,#{@tn_orange},#{@tn_blue}}"
set -g @tn_cap    "#{?client_prefix,#{@tn_orange},#{@tn_lilac}}"

# Nerd Font rounded segment caps, same as starship.toml
set -g @tn_l "\ue0b6"
set -g @tn_r "\ue0b4"

# Status bar: top, transparent background
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
set -g window-status-separator ""
set -gF status-style "bg=default,fg=#{@tn_subtle}"

# Left: square session box
set -g status-left "#[fg=#{@tn_dark},bg=#{E:@tn_cap},bold] #S #[bg=default,nobold] "

# Windows: square boxes, inactive = slate, current = accent (zoom icon when zoomed)
set -g window-status-format "#[fg=#{@tn_blue},bg=#{@tn_slate}] #I #W #[bg=default] "
set -g window-status-current-format "#[fg=#{?client_prefix,#{@tn_bg},#{@tn_text}},bg=#{E:@tn_accent},bold] #I #W#{?window_zoomed_flag, \U000f0293,} #[bg=default,nobold] "

# Right: time only
set -g status-right "#[fg=#{@tn_subtle},bg=#{@tn_ink}] \uf43a %R #[bg=default]"

# Panes: label on top border, active pane in accent
set -g pane-border-status top
set -g pane-border-lines single
set -gF pane-border-style "fg=#{@tn_slate}"
set -g pane-active-border-style "fg=#{E:@tn_accent}"
set -g pane-border-format "#{?pane_active,#[fg=#{E:@tn_accent} bold],#[fg=#{@tn_muted}]} #{pane_index} \uf120 #{pane_current_command} "

# Messages, copy mode, clock
set -gF message-style "fg=#{@tn_text},bg=#{@tn_slate}"
set -gF message-command-style "fg=#{@tn_blue},bg=#{@tn_navy}"
set -gF mode-style "fg=#{@tn_bg},bg=#{@tn_blue}"
set -gF clock-mode-colour "#{@tn_blue}"
set -gF display-panes-active-colour "#{@tn_blue}"
set -gF display-panes-colour "#{@tn_slate}"
