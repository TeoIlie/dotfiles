"$schema" = 'https://starship.rs/config-schema.json'

# Tokyo Night palette: same names and colours as the @tn_* vars in tmux.conf
palette = "tokyo_night"

format = """
[░▒▓](lilac)\
$os\
[](bg:blue fg:lilac)\
$directory\
[](fg:blue bg:slate)\
$git_branch\
$git_status\
[](fg:slate bg:navy)\
$nodejs\
$bun\
$rust\
$golang\
$php\
$python\
[](fg:navy bg:ink)\
$time\
[ ](fg:ink)\
\n$character"""

[directory]
style = "fg:text bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:slate"
format = '[[ $symbol $branch ](fg:blue bg:slate)]($style)'

[git_status]
style = "bg:slate"
format = '[[($all_status$ahead_behind )](fg:blue bg:slate)]($style)'

[nodejs]
symbol = ""
style = "bg:navy"
format = '[[ $symbol ($version) ](fg:blue bg:navy)]($style)'

[bun]
symbol = ""
style = "bg:navy"
format = '[[ $symbol ($version) ](fg:blue bg:navy)]($style)'

[rust]
symbol = ""
style = "bg:navy"
format = '[[ $symbol ($version) ](fg:blue bg:navy)]($style)'

[golang]
symbol = ""
style = "bg:navy"
format = '[[ $symbol ($version) ](fg:blue bg:navy)]($style)'

[php]
symbol = ""
style = "bg:navy"
format = '[[ $symbol ($version) ](fg:blue bg:navy)]($style)'

[python]
symbol = ""
style = "bg:navy"
format = '[[ $symbol ($version) (\($virtualenv\) )](fg:blue bg:navy)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:ink"
format = '[[  $time ](fg:subtle bg:ink)]($style)'

[os]
style = "bg:lilac fg:dark"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Ubuntu = "󰕈"
Macos = "󰀵"
Linux = "󰌽"
Arch = "󰣇"

[palettes.tokyo_night]
text = "#e3e5e5"
subtle = "#a0a9cb"
dark = "#090c0c"
lilac = "#a3aed2"
blue = "#769ff0"
slate = "#394260"
navy = "#212736"
ink = "#1d2230"
